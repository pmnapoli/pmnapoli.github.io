name: Refresh Google Scholar figures

on:
  schedule:
    - cron: "17 11 * * *"   # every day at 11:17 UTC (about 6:17 am Eastern)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scholar.yml"
      - ".github/scripts/update_scholar.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: scholar-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Google Scholar and update the page
        run: python3 .github/scripts/update_scholar.py index.html

      - name: Commit and publish if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then echo "Nothing to publish"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Refresh Google Scholar figures"
          git push
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request skipped"
